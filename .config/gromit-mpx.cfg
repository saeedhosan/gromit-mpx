# Config: ~/.config/gromit-mpx.cfg
# ==============================================================================
# Gromit-MPX Configuration - NeetCode Palette (Clean Syntax)
# ==============================================================================

# 1. TOOL DEFINITIONS
"Neet Cyan Pen"     = PEN (size=2 color="#00E5FF");
"Neet White Pen"    = PEN (size=2 color="#FFFFFF");
"Neet Yellow Pen"   = PEN (size=2 color="#FFD700");
"Neet Red Pen"      = PEN (size=2 color="#FF3366");

"Neet Cyan Arrow"   = LINE (size=2 color="#00E5FF" arrowsize=2);
"Neet Red Arrow"    = LINE (size=2 color="#FF3366" arrowsize=2);
"Neet Cyan Box"     = RECT (size=2 color="#00E5FF");
"Eraser"            = ERASER (size=50);

# 2. KEYBOARD & MOUSE MAPPINGS
# Primary Pen (Left Click) -> Cyan
"default"                  = "Neet Cyan Pen";

# Single Key Modifiers + Left Click
"default"[SHIFT]           = "Neet White Pen";     # Hold SHIFT   -> White Pen
"default"[CONTROL]         = "Neet Red Pen";       # Hold CTRL    -> Red Pen
"default"[ALT]             = "Neet Yellow Pen";    # Hold ALT     -> Yellow Pen

# Arrow & Box Shortcuts
"default"[2]               = "Neet Cyan Arrow";    # Button 2 (Middle Scroll Click) -> Arrow
"default"[Button3]         = "Eraser";             # Button 3 (Right Click)         -> Eraser

